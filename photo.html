<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f6f3ed">
<title>纸上的小人 · 班级合影</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f6f3ed; }
  canvas { display: block; cursor: pointer; }
  #titel {
    position: fixed; top: 30px; left: 34px; transform: rotate(-2.5deg);
    font: 19px/1.9 "Courier New", ui-monospace, monospace; color: #3a3440;
    user-select: none; pointer-events: none; white-space: nowrap;
  }
  #titel mark {
    background: #2e2839; color: #f6f2ea; padding: 2px 9px;
    display: inline-block; transform: rotate(1.4deg);
  }
  #titel mark:last-of-type { transform: rotate(-1.1deg); }
  .sprung {
    position: fixed; top: 30px; right: 34px; text-align: right;
    font: 12px/1.7 "Courier New", monospace; letter-spacing: 2px;
    user-select: none;
  }
  .sprung a { color: #a89f93; text-decoration: none; display: block; }
  .sprung a:hover { color: #2b2320; }
  .filter {
    position: fixed; right: 34px; display: flex; gap: 4px; align-items: baseline;
    font: 11px/1.9 "Courier New", ui-monospace, monospace; color: #a89f93;
    user-select: none;
  }
  .filter button {
    font: inherit; letter-spacing: 1px; color: #a89f93; background: transparent;
    border: none; border-bottom: 1px dotted #c9c1b5; padding: 0 3px; cursor: pointer;
  }
  .filter button:hover { color: #2b2320; }
  .filter button.an { color: #2e2839; border-bottom: 1px solid #2e2839; }
  #filterArt { top: 92px; }
  #filterMedia { top: 116px; }  #leiste {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    display: flex; gap: 8px; align-items: center;
  }
  #leiste button {
    font: 12px/1 "Courier New", monospace; letter-spacing: 3px; color: #7a7268;
    background: transparent; border: 1px solid #c9c1b5; border-radius: 999px;
    padding: 9px 18px 8px 21px; cursor: pointer; user-select: none;
  }
  #leiste button:hover { color: #2b2320; border-color: #2b2320; }
  #leiste button:disabled { opacity: .45; cursor: default; }
  #leiste button:disabled:hover { color: #7a7268; border-color: #c9c1b5; }
  /* 手机端：标题换行、导航与过滤器收紧、按钮条折行、去双击缩放 */
  @media (max-width: 719px) {
    body { overscroll-behavior: none; }
    button, a { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    #titel { font-size: 13px; line-height: 1.7; top: 16px; left: 16px; max-width: 54vw; white-space: normal; }
    .sprung { top: 16px; right: 16px; font-size: 11px; letter-spacing: 1px; }
    .sprung a { padding: 3px 0; }
    .filter { font-size: 10px; right: 16px; }
    .filter button { padding: 0 2px; }
    #filterArt { top: 100px; }
    #filterMedia { top: 122px; }
    #leiste { flex-wrap: wrap; justify-content: center; width: calc(100vw - 24px); gap: 6px; bottom: 10px; }
    #leiste button { font-size: 11px; letter-spacing: 2px; padding: 8px 12px 7px 14px; }
  }
</style>
</head>
<body data-modus="foto">
<canvas id="blatt"></canvas>
<div id="titel">我的 <mark>朋友们</mark> 要拍 <mark>合影</mark></div>
<div class="sprung">
  <a href="index.html">看看一个人 →</a>
  <a href="heads.html">看看一墙脸 →</a>
  <a href="crowd.html">来一群朋友 →</a>
</div>
<div class="filter" id="filterArt">物种
  <button data-v="alle" class="an">全部</button><button data-v="human">人</button><button data-v="dog">狗</button><button data-v="cat">猫</button><button data-v="rabbit">兔</button><button data-v="bear">熊</button><button data-v="alp">魇</button>
</div>
<div class="filter" id="filterMedia">介质
  <button data-v="alle" class="an">全部</button><button data-v="graphite">石墨</button><button data-v="watercolour">水彩</button><button data-v="ink">墨水</button><button data-v="marker">马克笔</button>
</div>
<div id="leiste">
  <button id="klasse">换 一 班</button>
  <button id="knips" disabled>拍 合 影</button>
</div>
<script src="app.js"></script>
<script src="doodle.js"></script>
<script src="photo.js"></script>
</body>
</html>
