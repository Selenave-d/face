<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
<meta name="theme-color" content="#f6f3ed">
<title>纸上的小人</title>
<link rel="stylesheet" href="stil.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f6f3ed; }
  canvas { display: block; cursor: crosshair; }
  #leiste {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    display: flex; gap: 8px; align-items: center;
  }
  #leiste button {
    font: 12px/1 "Courier New", monospace; letter-spacing: 3px; color: #7a7268;
    background: transparent; border: 1px solid #c9c1b5; border-radius: 999px;
    padding: 9px 18px 8px 21px; cursor: pointer; user-select: none;
  }
  #leiste button:hover { color: #2b2320; border-color: #2b2320; }
  #leiste button.aktiv { color: #f6f2ea; background: #2e2839; border-color: #2e2839; }
  /* 手机端：标题换行、导航收紧、按钮条折行、去双击缩放 */
  @media (max-width: 719px) {
    body { overscroll-behavior: none; }
    button, a { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    #titel { font-size: 13px; line-height: 1.7; top: 16px; left: 16px; max-width: 54vw; white-space: normal; }
    .sprung { top: 66px; left: 16px; right: auto; flex-wrap: wrap; gap: 4px 14px; font-size: 10px; letter-spacing: 1px; }
    .sprung a { padding: 2px 0; }
    #leiste { flex-wrap: wrap; justify-content: center; width: calc(100vw - 24px); gap: 6px; bottom: 10px; }
    #leiste button { font-size: 11px; letter-spacing: 2px; padding: 8px 12px 7px 14px; min-height: 44px; }   /* 触控目标够大：11px 字+短边距原生只有 ~28px */
  }
</style>
</head>
<body>
<canvas id="blatt" role="img" aria-label="一个手绘小人站在纸上"></canvas>
<div id="titel">我的 <mark>朋友们</mark> 都是 <mark>javascript</mark> 画的</div>
<nav class="sprung" aria-label="页导航">
  <a href="heads.html">一墙脸</a>
  <a href="crowd.html">一群朋友</a>
  <a href="photo.html">拍合影</a>
  <a href="clip.html">剪报</a>
  <a href="avatar.html">头像</a>
</nav>
<div id="leiste">
  <button class="ak aktiv" data-ak="stand">站 立</button>
  <button class="ak" data-ak="wave">挥 手</button>
  <button class="ak" data-ak="walk">走 路</button>
  <button class="ak" data-ak="jump">跳 跃</button>
  <button class="ak" data-ak="dance">跳 舞</button>
  <button id="neues">换 一 个</button>
</div>
<script src="app.js"></script>
</body>
</html>
