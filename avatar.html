<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f6f3ed">
<title>纸上的小人 · 头像</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f6f3ed; }
  canvas { display: block; }
  #titel {
    position: fixed; top: 30px; left: 34px; transform: rotate(-2.5deg);
    font: 19px/1.9 "Courier New", ui-monospace, monospace; color: #3a3440;
    user-select: none; pointer-events: none; white-space: nowrap;
  }
  #titel mark {
    background: #2e2839; color: #f6f2ea; padding: 2px 9px;
    display: inline-block; transform: rotate(1.4deg);
  }
  #titel mark:last-of-type { transform: rotate(-1.1deg); }
  .sprung {
    position: fixed; top: 30px; right: 34px; text-align: right;
    font: 12px/1.7 "Courier New", monospace; letter-spacing: 2px;
    user-select: none;
  }
  .sprung a { color: #a89f93; text-decoration: none; display: block; }
  .sprung a:hover { color: #2b2320; }
  #leiste {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    display: flex; gap: 8px; align-items: center;
  }
  #leiste button {
    font: 12px/1 "Courier New", monospace; letter-spacing: 3px; color: #7a7268;
    background: transparent; border: 1px solid #c9c1b5; border-radius: 999px;
    padding: 9px 18px 8px 21px; cursor: pointer; user-select: none;
  }
  #leiste button:hover { color: #2b2320; border-color: #2b2320; }
  #gesichte {
    position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%);
    display: flex; gap: 6px; align-items: center;
  }
  #gesichte button {
    font: 11px/1 "Courier New", monospace; letter-spacing: 2px; color: #a89f93;
    background: transparent; border: 1px dashed #c9c1b5; border-radius: 999px;
    padding: 6px 10px 5px 12px; cursor: pointer; user-select: none;
  }
  #gesichte button:hover { color: #2b2320; border-color: #2b2320; }
  #gesichte button.an { color: #2e2839; border-style: solid; border-color: #2e2839; }
  /* 手机端：标题换行、导航收紧、按钮条折行、去双击缩放 */
  @media (max-width: 719px) {
    body { overscroll-behavior: none; }
    button, a { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    #titel { font-size: 13px; line-height: 1.7; top: 16px; left: 16px; max-width: 54vw; white-space: normal; }
    .sprung { top: 16px; right: 16px; font-size: 11px; letter-spacing: 1px; }
    .sprung a { padding: 3px 0; }
    #leiste { flex-wrap: wrap; justify-content: center; width: calc(100vw - 24px); gap: 6px; bottom: 10px; }
    #leiste button { font-size: 11px; letter-spacing: 2px; padding: 8px 12px 7px 14px; }
    #gesichte { bottom: 58px; flex-wrap: wrap; justify-content: center; width: calc(100vw - 24px); }
    #gesichte button { font-size: 10px; padding: 5px 8px 4px 10px; }
  }
</style>
</head>
<body data-modus="avatar">
<canvas id="blatt"></canvas>
<div id="titel">我的 <mark>头像</mark> 也是 <mark>javascript</mark> 画的</div>
<div class="sprung">
  <a href="index.html">看看一个人 →</a>
  <a href="heads.html">看看一墙脸 →</a>
  <a href="crowd.html">来一群朋友 →</a>
  <a href="photo.html">拍合影 →</a>
  <a href="clip.html">剪报一张 →</a>
</div>
<div id="gesichte">
  <button data-g="sprich">说句话</button>
  <button data-g="blinz">眨眨眼</button>
  <button data-g="froh">笑一笑</button>
  <button data-g="boese">生气了</button>
  <button data-g="traurig">难过了</button>
  <button data-g="muede">犯困了</button>
  <button data-g="links">看左边</button>
  <button data-g="rechts">看右边</button>
  <button data-g="aufwachen">回 神</button>
</div>
<div id="leiste">
  <button id="neues">换 一 个</button>
  <button id="speicher">存 头 像</button>
</div>
<script src="app.js"></script>
<script src="avatar.js"></script>
</body>
</html>
